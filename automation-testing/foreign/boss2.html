<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Core</title>
  <style>
    body { margin: 0; padding: .8rem; font: 15px/1.5 system-ui, sans-serif; background: #fdf3e7; color: #3b2a14; }
  </style>
</head>
<body>
  <h3 style="margin:0 0 .5rem">Layer 3 &middot; cross-origin iframe (<span id="origin"></span>)</h3>
  <div id="core-slot"><p>Booting core&hellip;</p></div>
  <script>
    const p = new URLSearchParams(location.search);
    document.getElementById('origin').textContent = location.origin;
    customElements.define('dojo-core', class extends HTMLElement {
      connectedCallback() {
        const root = this.attachShadow({ mode: 'open' });
        root.innerHTML = `<style>
            :host { display: block; border: 2px solid #b45309; border-radius: 10px; padding: .8rem; }
            button { font: inherit; padding: .45rem .95rem; border-radius: 8px; border: 1px solid #b45309; background: #b45309; color: #fff; cursor: pointer; }
            code { font-size: 1.2rem; font-weight: 700; }
          </style>
          <h4 style="margin:0 0 .5rem">Layer 4 &middot; &lt;dojo-core&gt; shadow root</h4>
          <button type="button">Reveal</button>
          <p>Code: <code>&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</code></p>`;
        root.querySelector('button').addEventListener('click', async () => {
          const r = await (await fetch(`/api/peek/${encodeURIComponent(p.get('id'))}/${encodeURIComponent(p.get('t'))}`)).json();
          root.querySelector('code').textContent = r.code || r.error;
        });
      }
    });
    setTimeout(() => {
      document.getElementById('core-slot').replaceChildren(document.createElement('dojo-core'));
    }, 1000 + Math.random() * 2000);
  </script>
</body>
</html>
