<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>boss1.html</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="frame" data-challenge="matryoshka">
  <main>
    <h2 style="margin-top:0">Layer 1 &middot; iframe</h2>
    <div id="host-slot"><p class="muted">Assembling shell&hellip;</p></div>
  </main>
  <script src="/js/common.js"></script>
  <script>
    Dojo.attach();
    customElements.define('dojo-shell', class extends HTMLElement {
      connectedCallback() {
        const root = this.attachShadow({ mode: 'open' });
        root.innerHTML = `<style>
            :host { display: block; border: 2px solid var(--accent); border-radius: 10px; padding: .8rem; }
            iframe { width: 100%; height: 280px; border: 2px dashed var(--border); border-radius: 8px; }
          </style>
          <h3 style="margin:0 0 .5rem">Layer 2 &middot; &lt;dojo-shell&gt; shadow root</h3>
          <div class="inner"><p>Opening a channel to the foreign origin&hellip;</p></div>`;
        setTimeout(async () => {
          const f = document.createElement('iframe');
          f.title = 'Foreign core';
          f.src = `${await Dojo.foreignOrigin()}/boss2.html?id=${Dojo.id}&t=${Dojo.token}`;
          root.querySelector('.inner').replaceChildren(f);
        }, 1000 + Math.random() * 1500);
      }
    });
    setTimeout(() => {
      document.getElementById('host-slot').replaceChildren(document.createElement('dojo-shell'));
    }, 1500 + Math.random() * 1500);
  </script>
</body>
</html>
