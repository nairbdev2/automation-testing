<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>frame.html</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="frame" data-challenge="iframe-basic">
  <main>
    <form id="name-form">
      <label for="full-name">Full name</label>
      <div class="row">
        <input id="full-name" name="name" placeholder="Full name" autocomplete="off">
        <button type="submit">Submit</button>
      </div>
    </form>
    <div id="error"></div>
  </main>
  <script src="/js/common.js"></script>
  <script>
    Dojo.attach();
    document.getElementById('name-form').addEventListener('submit', (e) => {
      e.preventDefault();
      Dojo.solve(e.target.name.value);
    });
  </script>
</body>
</html>
